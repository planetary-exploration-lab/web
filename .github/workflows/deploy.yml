# Push to main: build with people from web-private (read-only deploy key), run every check,
# then deploy to GitHub Pages. Any failed check stops the deploy.
#
# Repository settings this needs:
#   secret   WEB_PRIVATE_DEPLOY_KEY  private half of a read-only deploy key on web-private
#   Pages    Source: GitHub Actions
# Optional repository variables for cutover: BASE_PATH ("/"), SITE_URL ("https://www.pxl.earth"), INDEXING ("true").
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_PATH: ${{ vars.BASE_PATH || '/web/' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://planetary-exploration-lab.github.io' }}
      INDEXING: ${{ vars.INDEXING || 'false' }}
      PEOPLE_DIR: private/people
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out web-private (people data)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: planetary-exploration-lab/web-private
          ssh-key: ${{ secrets.WEB_PRIVATE_DEPLOY_KEY }}
          path: private
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run check
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # The org default token is read-only, so grant Pages permissions here.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
